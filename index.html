<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>כרטיסי על ⭐ כרטיסיות עידוד אישיות לילדים</title>
<meta name="description" content="יוצרים כרטיסיות עידוד אישיות לילדים בכמה שאלות קצרות, מורידים PDF דו-צדדי ומדפיסים. בחינם, בלי הרשמה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Varela+Round&family=Gveret+Levin&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#FFF6EC; --ink:#3B2F2F; --ink-soft:#7A6A63;
  --primary:#FF7A59; --primary-dark:#E85C3A; --primary-light:#FFE8DF;
  --amber:#FFC24B; --card:#FFFFFF; --line:#F0E2D0;
  --radius:22px; --shadow:0 6px 24px rgba(90,50,20,.10);
  --font-ui:'Rubik','Varela Round',sans-serif;
  --font-print:'Varela Round','Rubik',sans-serif;
  --font-hand:'Gveret Levin',cursive;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui),sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh; min-height:100dvh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(420px 300px at 85% -40px, #FFE1D4 0%, transparent 70%),
    radial-gradient(380px 300px at -60px 30%, #FFF0C9 0%, transparent 70%),
    radial-gradient(400px 320px at 110% 85%, #E3F0FF 0%, transparent 70%);
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input{font-family:inherit}

.app{max-width:560px; margin:0 auto; padding:20px 18px 60px}

/* ---------- screens ---------- */
.screen{display:none; animation:fadeUp .35s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

/* ---------- hero ---------- */
.hero{text-align:center; padding:34px 0 10px}
.hero-badge{display:inline-block; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:6px 16px; font-size:14px; color:var(--ink-soft); box-shadow:var(--shadow)}
.hero h1{font-size:52px; margin:18px 0 6px; line-height:1.1; letter-spacing:-.5px}
.hero h1 .star{color:var(--amber)}
.hero p.sub{font-size:19px; color:var(--ink-soft); margin:0 auto 26px; max-width:420px; line-height:1.5}
.demo-card{
  width:270px; margin:0 auto 30px; background:#FFD6E0; border-radius:18px; padding:20px 18px 14px;
  box-shadow:0 10px 30px rgba(200,80,120,.25); transform:rotate(-2.5deg);
  border:2px dashed rgba(0,0,0,.18);
}
.demo-card .emo{font-size:40px}
.demo-card .cname{font-family:var(--font-hand); font-size:28px; color:#B03060; margin:2px 0}
.demo-card .csent{font-size:16px; font-weight:500; color:#6D2B47}
.demo-card .csig{font-size:11px; color:rgba(109,43,71,.6); margin-top:10px}
.cta{
  display:inline-block; background:var(--primary); color:#fff; font-size:21px; font-weight:700;
  padding:16px 44px; border-radius:999px; box-shadow:0 8px 22px rgba(255,122,89,.4);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:active{transform:scale(.96); box-shadow:0 3px 10px rgba(255,122,89,.4)}
.hero-feats{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:26px}
.hero-feats span{background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13.5px; color:var(--ink-soft)}
.privacy{margin-top:26px; font-size:13px; color:var(--ink-soft)}
.privacy b{color:var(--ink)}

/* ---------- wizard ---------- */
.progress-wrap{position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 14px}
.progress-top{display:flex; justify-content:space-between; align-items:center; font-size:13.5px; color:var(--ink-soft); margin-bottom:8px}
.progress{height:8px; background:#F3E6D6; border-radius:99px; overflow:hidden}
.progress>i{display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--primary)); border-radius:99px; transition:width .3s ease}
.step-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 22px 24px; border:1.5px solid #FFF}
.step-card h2{font-size:25px; margin:0 0 6px; line-height:1.25}
.step-card .hint{font-size:15px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5}
.big-input{
  width:100%; font-size:22px; padding:15px 18px; border-radius:16px; border:2px solid var(--line);
  background:#FFFBF5; outline:none; transition:border-color .15s;
}
.big-input:focus{border-color:var(--primary)}
.nav-row{display:flex; gap:10px; margin-top:24px}
.btn-next,.btn-back{border-radius:999px; font-weight:700; font-size:17px; padding:14px 0}
.btn-next{flex:2; background:var(--primary); color:#fff; box-shadow:0 6px 16px rgba(255,122,89,.35)}
.btn-next:disabled{background:#EBD9CC; color:#B7A294; box-shadow:none; cursor:default}
.btn-back{flex:1; background:#fff; border:2px solid var(--line); color:var(--ink-soft)}
.skip-link{display:block; margin:14px auto 0; color:var(--ink-soft); font-size:14.5px; text-decoration:underline}

.opt-row{display:flex; gap:12px}
.opt-big{
  flex:1; background:#FFFBF5; border:2px solid var(--line); border-radius:18px; padding:20px 10px;
  text-align:center; font-size:19px; font-weight:500; transition:all .13s;
}
.opt-big .o-emo{font-size:36px; display:block; margin-bottom:8px}
.opt-big.sel{border-color:var(--primary); background:var(--primary-light); box-shadow:0 4px 14px rgba(255,122,89,.2)}
.opt-big .rec{display:block; font-size:12px; color:var(--primary-dark); margin-top:6px; font-weight:700}

.age-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:9px}
.age-grid button{
  background:#FFFBF5; border:2px solid var(--line); border-radius:14px; padding:13px 0; font-size:18px; font-weight:500;
}
.age-grid button.sel{border-color:var(--primary); background:var(--primary-light); font-weight:700}

.chips{display:flex; flex-wrap:wrap; gap:9px}
.chip{
  background:#FFFBF5; border:2px solid var(--line); border-radius:999px; padding:10px 16px;
  font-size:16px; transition:all .12s;
}
.chip.sel{border-color:var(--primary); background:var(--primary-light); font-weight:500}
.add-row{display:flex; gap:8px; margin-top:14px}
.add-row input{flex:1; font-size:16px; padding:11px 14px; border-radius:12px; border:2px solid var(--line); background:#FFFBF5; outline:none}
.add-row button{background:var(--amber); border-radius:12px; padding:0 18px; font-weight:700; font-size:15px}

.palette-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pal{border:2px solid var(--line); border-radius:16px; padding:13px; background:#FFFBF5; text-align:right; font-size:15.5px; font-weight:500}
.pal.sel{border-color:var(--primary); background:var(--primary-light)}
.pal .dots{display:flex; gap:5px; margin-bottom:8px}
.pal .dots i{width:22px; height:22px; border-radius:50%; display:block; border:1px solid rgba(0,0,0,.08)}

.radio-col{display:flex; flex-direction:column; gap:10px}
.radio-opt{display:flex; align-items:center; gap:12px; background:#FFFBF5; border:2px solid var(--line); border-radius:16px; padding:14px 16px; font-size:16.5px; text-align:right}
.radio-opt.sel{border-color:var(--primary); background:var(--primary-light)}
.radio-opt .r-emo{font-size:24px}

/* ---------- preview ---------- */
.done-head{text-align:center; margin:10px 0 20px}
.done-head h2{font-size:30px; margin:0 0 6px}
.done-head p{color:var(--ink-soft); margin:0; font-size:16px}
.view-toggle{display:flex; background:#F3E6D6; border-radius:999px; padding:4px; margin:0 auto 18px; width:max-content}
.view-toggle button{padding:9px 22px; border-radius:999px; font-size:15px; font-weight:500; color:var(--ink-soft)}
.view-toggle button.on{background:#fff; color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.12); font-weight:700}
.pv-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px}
.pv-card{border-radius:14px; padding:14px 10px 10px; text-align:center; border:2px dashed rgba(0,0,0,.15); min-height:130px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
.pv-card .e{font-size:30px}
.pv-card .n{font-size:19px; margin:1px 0}
.pv-card .s{font-size:13.5px; font-weight:500; line-height:1.35; color:rgba(0,0,0,.62)}
.pv-card .g{font-size:10px; color:rgba(0,0,0,.4); margin-top:6px}
.pv-card.hand .n{font-family:var(--font-hand)}
.pv-card.hand .s{font-family:var(--font-hand); font-size:19px}
.pv-sheets{display:block}
.pvA4Label{font-weight:700; font-size:14px; margin:16px 0 6px; color:rgba(0,0,0,.65)}
.pvA4{background:#fff; border-radius:10px; box-shadow:0 3px 14px rgba(0,0,0,.10); overflow:hidden; position:relative; direction:ltr}
.pvA4-scale{transform-origin:top left; width:794px; height:1123px}
.pv-card.back-card{position:relative; overflow:hidden}
.pv-card.back-card .bp{position:absolute; inset:6px; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; align-items:center; justify-items:center; opacity:.25; pointer-events:none}
.pv-card.back-card .be{font-size:38px; opacity:.9; position:relative}
.pv-card.back-card .bn{font-size:15px; font-weight:700; position:relative}
.action-col{display:flex; flex-direction:column; gap:11px; margin-top:6px}
.btn-main{background:var(--primary); color:#fff; border-radius:999px; padding:17px 0; font-size:19px; font-weight:700; box-shadow:0 8px 20px rgba(255,122,89,.35); text-align:center; width:100%}
.btn-main:disabled{opacity:.6}
.btn-sec{background:#fff; border:2px solid var(--line); border-radius:999px; padding:13px 0; font-size:16.5px; font-weight:500; color:var(--ink); width:100%}
.print-tip{background:#FFF9E8; border:1.5px solid #F5DFA8; border-radius:16px; padding:14px 16px; font-size:14px; color:#7A5B1E; line-height:1.6; margin-top:18px}
footer{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:40px; line-height:1.7}

/* ---------- print/pdf sheets ---------- */
#printArea{position:absolute; left:-12000px; top:0}
.sheet{width:210mm; height:297mm; background:#fff; padding:10mm; display:grid; grid-template-columns:90mm 90mm; grid-auto-rows:60mm; column-gap:10mm; row-gap:12.33mm; direction:ltr}
.cell{border:0.45mm dashed rgba(60,40,40,.45); border-radius:4.5mm; padding:1.6mm}
.fcard{width:100%; height:100%; border-radius:3.2mm; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2mm 4mm; position:relative}
.fcard .e{font-size:13mm; line-height:1}
.fcard .n{font-size:7.6mm; font-weight:700; margin:1mm 0 0.5mm}
.fcard .s{font-size:4.6mm; font-weight:500; line-height:1.3; color:rgba(0,0,0,.66)}
.fcard .g{font-size:2.9mm; color:rgba(0,0,0,.42); margin-top:1.6mm}
.fcard.hand .n{font-family:var(--font-hand); font-weight:400; font-size:8.6mm}
.fcard.hand .s{font-family:var(--font-hand); font-size:6.4mm}
.fcard.back .pat{position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; align-items:center; justify-items:center; opacity:.25; padding:3mm}
.fcard.back .big{position:relative; font-size:16mm}
.fcard.back .bn{position:relative; font-size:5.2mm; font-weight:700; color:rgba(0,0,0,.4); margin-top:1mm}
.fcard.back .brand{font-size:2.9mm; color:rgba(0,0,0,.38); margin-top:1.2mm}
@media print{
  body>*:not(#printArea){display:none !important}
  #printArea{position:static; left:0}
  .sheet{page-break-after:always}
  @page{size:A4; margin:0}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="printArea" aria-hidden="true"></div>
<script src="app.js?v=5"></script>
</body>
</html>
