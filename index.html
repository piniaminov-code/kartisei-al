<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>כרטיסי על ⭐ כרטיסיות עידוד אישיות לילדים</title>
<meta name="description" content="יוצרים כרטיסיות עידוד אישיות לילדים בכמה שאלות קצרות, מורידים PDF דו-צדדי ומדפיסים. בחינם, בלי הרשמה.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 18l-6.4 3.4L7 14.3l-5.3-5 7.2-.9z' fill='%23FFC24B' stroke='%23E85C3A' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vendor/html2canvas-1.4.1.min.js" defer></script>
<script src="vendor/jspdf-2.5.1.umd.min.js" defer></script>
<style>
:root{
  --bg:#FFF6EC; --ink:#3B2F2F; --ink-soft:#7A6A63;
  --primary:#FF7A59; --primary-dark:#E85C3A; --primary-light:#FFE8DF;
  --amber:#FFC24B; --card:#FFFFFF; --line:#F0E2D0;
  --radius:22px; --shadow:0 6px 24px rgba(90,50,20,.10);
  --font-ui:'Rubik','Varela Round',sans-serif;
  --font-print:'Varela Round','Rubik',sans-serif;
  --font-hand:'Gveret Levin',cursive;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0; overflow-x:hidden; overflow-x:clip}
body{
  font-family:var(--font-ui),sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh; min-height:100dvh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(420px 300px at 85% -40px, #FFE1D4 0%, transparent 70%),
    radial-gradient(380px 300px at -60px 30%, #FFF0C9 0%, transparent 70%),
    radial-gradient(400px 320px at 110% 85%, #E3F0FF 0%, transparent 70%);
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input{font-family:inherit}

.app{max-width:560px; margin:0 auto; padding:20px 18px 60px}

/* ---------- screens ---------- */
.screen{display:none; animation:fadeUp .35s ease}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

/* ---------- hero ---------- */
.hero{text-align:center; padding:34px 0 10px}
.hero-badge{display:inline-block; background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:6px 16px; font-size:14px; color:var(--ink-soft); box-shadow:var(--shadow)}
.hero h1{font-size:52px; margin:18px 0 6px; line-height:1.1; letter-spacing:-.5px}
.hero h1 .star{color:var(--amber)}
.hero p.sub{font-size:19px; color:var(--ink-soft); margin:0 auto 26px; max-width:420px; line-height:1.5}
.demo-card{
  width:270px; margin:0 auto 30px; background:#FFD6E0; border-radius:18px; padding:20px 18px 14px;
  box-shadow:0 10px 30px rgba(200,80,120,.25); transform:rotate(-2.5deg);
  border:2px dashed rgba(0,0,0,.18);
}
.demo-card .emo{font-size:40px}
.demo-card .cname{font-family:var(--font-hand); font-size:28px; color:#B03060; margin:2px 0}
.demo-card .csent{font-size:16px; font-weight:500; color:#6D2B47}
.demo-card .csig{font-size:11px; color:rgba(109,43,71,.6); margin-top:10px}
.cta{
  display:inline-block; background:var(--primary); color:#fff; font-size:21px; font-weight:700;
  padding:16px 44px; border-radius:999px; box-shadow:0 8px 22px rgba(255,122,89,.4);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:active{transform:scale(.96); box-shadow:0 3px 10px rgba(255,122,89,.4)}
.hero-feats{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:26px}
.hero-feats span{background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13.5px; color:var(--ink-soft)}
.privacy{margin-top:26px; font-size:13px; color:var(--ink-soft)}
.privacy b{color:var(--ink)}

/* ---------- wizard ---------- */
.progress-wrap{position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 14px}
.progress-top{display:flex; justify-content:space-between; align-items:center; font-size:13.5px; color:var(--ink-soft); margin-bottom:8px}
.progress{height:8px; background:#F3E6D6; border-radius:99px; overflow:hidden}
.progress>i{display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--primary)); border-radius:99px; transition:width .3s ease}
.step-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 22px 24px; border:1.5px solid #FFF}
.step-card h2{font-size:25px; margin:0 0 6px; line-height:1.25}
.step-card .hint{font-size:15px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5}
.big-input{
  width:100%; font-size:22px; padding:15px 18px; border-radius:16px; border:2px solid var(--line);
  background:#FFFBF5; outline:none; transition:border-color .15s;
}
.big-input:focus{border-color:var(--primary)}
.nav-row{display:flex; gap:10px; margin-top:24px}
.btn-next,.btn-back{border-radius:999px; font-weight:700; font-size:17px; padding:14px 0}
.btn-next{flex:2; background:var(--primary); color:#fff; box-shadow:0 6px 16px rgba(255,122,89,.35)}
.btn-next:disabled{background:#EBD9CC; color:#B7A294; box-shadow:none; cursor:default}
.btn-back{flex:1; background:#fff; border:2px solid var(--line); color:var(--ink-soft)}
.skip-link{display:block; margin:14px auto 0; color:var(--ink-soft); font-size:14.5px; text-decoration:underline}

.opt-row{display:flex; gap:12px}
.opt-big{
  flex:1; background:#FFFBF5; border:2px solid var(--line); border-radius:18px; padding:20px 10px;
  text-align:center; font-size:19px; font-weight:500; transition:all .13s;
}
.opt-big .o-emo{font-size:36px; display:block; margin-bottom:8px}
.opt-big.sel{border-color:var(--primary); background:var(--primary-light); box-shadow:0 4px 14px rgba(255,122,89,.2)}
.opt-big .rec{display:block; font-size:12px; color:var(--primary-dark); margin-top:6px; font-weight:700}

.age-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:9px}
.age-grid button{
  background:#FFFBF5; border:2px solid var(--line); border-radius:14px; padding:13px 0; font-size:18px; font-weight:500;
}
.age-grid button.sel{border-color:var(--primary); background:var(--primary-light); font-weight:700}

.chips{display:flex; flex-wrap:wrap; gap:9px}
.chip{
  background:#FFFBF5; border:2px solid var(--line); border-radius:999px; padding:10px 16px;
  font-size:16px; transition:all .12s;
}
.chip.sel{border-color:var(--primary); background:var(--primary-light); font-weight:500}
.add-row{display:flex; gap:8px; margin-top:14px}
.add-row input{flex:1; font-size:16px; padding:11px 14px; border-radius:12px; border:2px solid var(--line); background:#FFFBF5; outline:none}
.add-row button{background:var(--amber); border-radius:12px; padding:0 18px; font-weight:700; font-size:15px}

.palette-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pal{border:2px solid var(--line); border-radius:16px; padding:13px; background:#FFFBF5; text-align:right; font-size:15.5px; font-weight:500}
.pal.sel{border-color:var(--primary); background:var(--primary-light)}
.pal .dots{display:flex; gap:5px; margin-bottom:8px}
.pal .dots i{width:22px; height:22px; border-radius:50%; display:block; border:1px solid rgba(0,0,0,.08)}

.radio-col{display:flex; flex-direction:column; gap:10px}
.radio-opt{display:flex; align-items:center; gap:12px; background:#FFFBF5; border:2px solid var(--line); border-radius:16px; padding:14px 16px; font-size:16.5px; text-align:right}
.radio-opt.sel{border-color:var(--primary); background:var(--primary-light)}
.radio-opt .r-emo{font-size:24px}

/* ---------- preview ---------- */
.done-head{text-align:center; margin:10px 0 20px}
.done-head h2{font-size:30px; margin:0 0 6px}
.done-head p{color:var(--ink-soft); margin:0; font-size:16px}
.view-toggle{display:flex; background:#F3E6D6; border-radius:999px; padding:4px; margin:0 auto 18px; width:max-content}
.view-toggle button{padding:9px 22px; border-radius:999px; font-size:15px; font-weight:500; color:var(--ink-soft)}
.view-toggle button.on{background:#fff; color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.12); font-weight:700}
.pv-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:20px}
.pv-card{direction:rtl; border-radius:14px; padding:14px 10px 10px; text-align:center; border:2px dashed rgba(0,0,0,.15); min-height:130px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
.pv-card .e{font-size:30px}
.pv-card .n{font-size:19px; margin:1px 0}
.pv-card .s{font-size:13.5px; font-weight:500; line-height:1.35; color:rgba(0,0,0,.62)}
.pv-card .g{font-size:10px; color:rgba(0,0,0,.4); margin-top:6px}
.pv-card.hand .n{font-family:var(--font-hand)}
.pv-card.hand .s{font-family:var(--font-hand); font-size:19px}
.pv-sheets{display:block}
.pvA4Label{font-weight:700; font-size:14px; margin:16px 0 6px; color:rgba(0,0,0,.65)}
.pvA4{background:#fff; border-radius:10px; box-shadow:0 3px 14px rgba(0,0,0,.10); overflow:hidden; position:relative; direction:ltr}
.pvA4-scale{transform-origin:top left; width:794px; height:1123px}
.pv-card.back-card{position:relative; overflow:hidden}
.pv-card.back-card .bp{position:absolute; inset:6px; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; align-items:center; justify-items:center; opacity:.25; pointer-events:none}
.pv-card.back-card .be{font-size:38px; opacity:.9; position:relative}
.pv-card.back-card .bn{font-size:15px; font-weight:700; position:relative}
.action-col{display:flex; flex-direction:column; gap:11px; margin-top:6px}
.btn-main{background:var(--primary); color:#fff; border-radius:999px; padding:17px 0; font-size:19px; font-weight:700; box-shadow:0 8px 20px rgba(255,122,89,.35); text-align:center; width:100%}
.btn-main:disabled{opacity:.6}
.btn-sec{background:#fff; border:2px solid var(--line); border-radius:999px; padding:13px 0; font-size:16.5px; font-weight:500; color:var(--ink); width:100%}
.print-tip{background:#FFF9E8; border:1.5px solid #F5DFA8; border-radius:16px; padding:14px 16px; font-size:14px; color:#7A5B1E; line-height:1.6; margin-top:18px}
footer{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:40px; line-height:1.7}

/* ---------- wizard extras ---------- */
.tile-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{background:#FFFBF5; border:2px solid var(--line); border-radius:16px; padding:13px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; transition:all .12s}
.tile.sel{border-color:var(--primary); background:var(--primary-light); box-shadow:0 4px 14px rgba(255,122,89,.2)}
.tile .t-emo{font-size:30px}
.tile .t-lab{font-size:16.5px; font-weight:700}
.tile .t-desc{font-size:12.5px; color:var(--ink-soft); line-height:1.35}
.grp{font-size:16px; margin:20px 0 10px}
.seg{display:flex; gap:6px; background:#F3E6D6; border-radius:16px; padding:5px}
.seg button{flex:1; border-radius:12px; padding:10px 4px; font-size:14px; font-weight:500; color:var(--ink-soft); line-height:1.35}
.seg button.on{background:#fff; color:var(--ink); font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.12)}
.seg small{font-size:12px; font-weight:400}
.big-area{width:100%; font-size:17px; line-height:1.55; padding:13px 15px; border-radius:16px; border:2px solid var(--line); background:#FFFBF5; outline:none; resize:vertical; font-family:inherit}
.big-area:focus{border-color:var(--primary)}
.count-note{font-size:14px; color:var(--primary-dark); margin-top:8px; min-height:1em}
.live{background:#F7EEE3; border-radius:16px; padding:10px 10px 8px; margin-bottom:16px}
.live-l{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px}
.live-row{display:flex; gap:8px; direction:ltr}
.live-row .lv{flex:1; min-width:0}
.live-cap{display:flex; gap:8px; font-size:12px; color:var(--ink-soft); text-align:center; direction:ltr}
.live-cap span{flex:1}
.mc-scale{position:absolute; top:0; left:0; transform-origin:top left; direction:ltr}
.lv,.dthumb,.bthumb,.pvc{position:relative; overflow:hidden; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.10)}
.design-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:6px}
.dtile{background:#FFFBF5; border:2px solid var(--line); border-radius:16px; padding:8px 8px 10px; text-align:center; display:flex; flex-direction:column; gap:3px}
.dtile.sel{border-color:var(--primary); background:var(--primary-light)}
.dtile b{font-size:14.5px; margin-top:5px}
.dtile span{font-size:12px; color:var(--ink-soft)}
.pal-row{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px}
.pal-row .pal{flex:1 1 30%; padding:8px; font-size:13px}
.font-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px}
.ftile{background:#FFFBF5; border:2px solid var(--line); border-radius:14px; padding:10px 8px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; overflow:hidden}
.ftile.sel{border-color:var(--primary); background:var(--primary-light)}
.fsample{line-height:1.2; color:#B03060; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:clip}
.fsample2{line-height:1.3; color:var(--ink)}
.flabel{font-size:12px; color:var(--ink-soft); margin-top:4px}
.flabel em{font-style:normal; color:var(--primary-dark); font-weight:700}
.back-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.bopt{background:#FFFBF5; border:2px solid var(--line); border-radius:14px; padding:7px 6px 9px; display:flex; flex-direction:column; gap:3px; text-align:center}
.bopt.sel{border-color:var(--primary); background:var(--primary-light)}
.bopt b{font-size:13.5px; margin-top:4px}
.bopt span{font-size:11.5px; color:var(--ink-soft)}
.nothumb{height:100%; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-soft); background:repeating-linear-gradient(45deg,#fff 0 6px,#f4ece2 6px 12px)}
.lay-ic{display:grid; gap:2px; width:34px; height:46px; padding:3px; background:#fff; border:1.5px solid var(--line); border-radius:4px; flex:none}
.lay-ic i{background:var(--primary-light); border:1px dashed #E0A08A; border-radius:2px}
.radio-opt small{color:var(--ink-soft); font-size:13px}
.fav-box{background:#fff; border:2px solid #F5DFA8; border-radius:18px; padding:14px; margin:0 auto 18px; max-width:340px; box-shadow:var(--shadow)}
.fav-t{font-weight:700; font-size:16px}
.fav-d{font-size:13.5px; color:var(--ink-soft); margin:4px 0 10px}
.cta.small{font-size:17px; padding:11px 28px}
.link-btn{display:block; margin:9px auto 0; font-size:13px; color:var(--ink-soft); text-decoration:underline}
.fav-apply{width:100%; background:#FFF9E8; border:1.5px solid #F5DFA8; border-radius:12px; padding:10px; font-size:14.5px; font-weight:500; margin-bottom:12px; color:#7A5B1E}
.sit-row{display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 14px; font-size:15px}
.sit-row select{font-family:inherit; font-size:15px; padding:8px 10px; border-radius:12px; border:2px solid var(--line); background:#fff}
.view-toggle button{padding:9px 16px}
.pv-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:20px}
.editor{margin-bottom:20px}
.ed-hint{font-size:13.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5}
.ed-row{display:flex; align-items:flex-start; gap:6px; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:8px; margin-bottom:8px}
.ed-num{font-size:12px; color:var(--ink-soft); width:16px; padding-top:9px; text-align:center}
.ed-emo{font-size:22px; width:38px; height:38px; border-radius:10px; background:#FFFBF5; border:1.5px solid var(--line); flex:none}
.ed-row textarea{flex:1; overflow:hidden; min-height:44px; min-width:0; font-family:inherit; font-size:15px; line-height:1.45; border:1.5px solid var(--line); border-radius:10px; padding:7px 9px; resize:vertical; background:#FFFBF5; outline:none; direction:rtl}
.ed-row textarea:focus{border-color:var(--primary)}
.ed-btns{display:flex; flex-direction:column; gap:3px}
.ed-btns button{width:30px; height:24px; border-radius:7px; background:#F3E6D6; font-size:11px; color:var(--ink)}
.ed-btns button:disabled{opacity:.35}
.ed-btns button[data-act=del]{background:#FCE3DC; color:#B5401F}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(30px); background:#3B2F2F; color:#fff; padding:11px 18px; border-radius:999px; font-size:14.5px; opacity:0; transition:all .25s; pointer-events:none; z-index:20; max-width:90vw; text-align:center}
.toast.on{opacity:1; transform:translateX(-50%)}
@media (max-width:380px){.view-toggle button{padding:8px 11px; font-size:14px}.seg button{font-size:13px}}

/* ---------- print/pdf sheets ---------- */
#printArea{position:fixed; left:0; top:0; width:0; height:0; overflow:hidden; pointer-events:none; z-index:-1}
.sheet{width:210mm; height:297mm; background:#fff; padding:10mm; display:grid; direction:ltr; align-content:start}
.cell{border:0.45mm dashed rgba(60,40,40,.45); border-radius:4.5mm; padding:1.6mm}
.cell.empty{border-color:transparent}

/* ---------- card base: every size is in em of --u (1mm on regular cards) ---------- */
.fcard{direction:rtl; width:100%; height:100%; border-radius:3.2mm; position:relative; overflow:hidden;
 font-size:var(--u,1mm); background:var(--bg); color:var(--ink); font-family:var(--ff);
 display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2.4em 4.6em}
.fcard .ct{position:relative; z-index:2; width:100%; max-height:100%; display:flex; flex-direction:column; align-items:center; text-align:center}
.fcard .e{font-size:calc(12.5em * var(--fit,1)); line-height:1.05}
.fcard .n{font-size:calc(7.4em * var(--fs,1) * var(--fit,1) * var(--nfit,1)); font-weight:var(--nw); color:var(--ac); line-height:1.2; margin:.12em 0 .06em; white-space:nowrap; max-width:100%}
.fcard .s{font-size:calc(4.55em * var(--fs,1) * var(--fit,1)); font-weight:var(--tw); color:var(--ink); line-height:1.32; text-wrap:balance; overflow-wrap:normal; word-break:normal; hyphens:none; max-width:100%}
.fcard .g{font-size:calc(2.9em * var(--fit,1)); color:var(--soft); margin-top:.55em; font-family:'Rubik',sans-serif}
.fcard .bn{font-size:calc(5.4em * var(--fs,1) * var(--nfit,1)); font-weight:var(--nw); color:var(--ac); white-space:nowrap; max-width:100%; line-height:1.2}
.fcard .big{font-size:16em; line-height:1.05}
.fcard .brand{font-size:2.9em; color:rgba(0,0,0,.38); margin-top:.4em; font-family:'Rubik',sans-serif}
.fcard.solid{padding:0}
.fcard img.emo{width:1em; height:1em; display:inline-block; vertical-align:-.14em; object-fit:contain}
.fcard .e img.emo,.fcard .big img.emo{display:block; margin:0 auto}
.fcard svg.shp{width:1em; height:1em; display:inline-block; vertical-align:-.12em; overflow:visible}
.fcard .brand svg.shp{width:.9em; height:.9em}
.ed-emo img.emo{width:24px; height:24px; display:block; margin:auto}
.fcard.f-back{justify-content:center}

/* classic */
.d-classic.f-back .pat{position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; align-items:center; justify-items:center; opacity:.25; padding:3em; color:var(--ac); z-index:1}
.d-classic.f-back .bn{opacity:.75}

/* night sky */
.d-night{background:radial-gradient(circle at 78% 18%, var(--bg2) 0%, var(--bg) 72%); padding:3em 9em}
.d-night .frame{position:absolute; inset:2.2em; border:.32em solid rgba(244,201,93,.55); border-radius:2.2em; z-index:1}
.d-night .star{position:absolute; color:#F7E3A6; line-height:1; z-index:1; transform:translate(-50%,-50%)}
.d-night .moon{position:absolute; left:4.6em; top:4em; width:9em; height:9em; z-index:1}
.d-night .moon svg{width:100%; height:100%; display:block}
.d-night .moon.mb{position:relative; left:0; top:0; width:17em; height:17em; margin-bottom:1em}
.d-night .e{filter:none}
.d-night .g{color:var(--soft)}
.d-night.f-back .bn{color:#F4C95D}

/* postcard */
.d-postcard{background:transparent; padding:5em 15em 4.6em 15em}
.d-postcard .air{position:absolute; inset:0; background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2724%27%20height%3D%2724%27%3E%3Crect%20width%3D%2724%27%20height%3D%2724%27%20fill%3D%27%23fff%27%2F%3E%3Cpath%20d%3D%27M0%2024H6L18%200H12Z%27%20fill%3D%27%23D64545%27%2F%3E%3Cpath%20d%3D%27M12%2024H18L30%200H24Z%27%20fill%3D%27%232B59A8%27%2F%3E%3Cpath%20d%3D%27M-12%2024H-6L6%200H0Z%27%20fill%3D%27%232B59A8%27%2F%3E%3C%2Fsvg%3E"); background-size:6em 6em; z-index:0}
.d-postcard .paper{position:absolute; inset:1.9em; background:var(--bg); border-radius:1.6em; z-index:0}
.d-postcard .stamp{position:absolute; left:4.2em; top:4.2em; width:11.5em; height:13.5em; background:#fff; border:.55em dotted #CDBFA8; padding:.9em; z-index:3}
.d-postcard .stamp-in{width:100%; height:100%; display:flex; align-items:center; justify-content:center; border-radius:.3em}
.d-postcard .stamp-in span{font-size:7.2em; line-height:1}
.d-postcard .pmark{position:absolute; left:11.5em; top:13.5em; width:11em; height:11em; border:.35em solid var(--ac); border-radius:50%; opacity:.32; z-index:3}
.d-postcard .pmark i{position:absolute; left:-4em; right:-6em; height:.35em; background:var(--ac); border-radius:1em}
.d-postcard .pmark i:nth-child(1){top:3em}.d-postcard .pmark i:nth-child(2){top:5.1em}.d-postcard .pmark i:nth-child(3){top:7.2em}
.d-postcard .n{font-weight:var(--nw)}
.d-postcard.f-back{padding:0}
.d-postcard .pc-line{position:absolute; left:52%; top:12%; bottom:12%; width:.3em; background:#CDBFA8; z-index:2}
.d-postcard.f-back .stamp{left:auto; right:auto; left:6.5em; top:5.5em; width:9.5em; height:11em}
.d-postcard .pc-left{position:absolute; left:7em; right:52%; top:52%; padding-right:4em; z-index:2; text-align:right}
.d-postcard .pc-left i{display:block; height:.3em; background:#CDBFA8; margin-top:6em}
.d-postcard .pc-to{font-size:calc(4.6em * var(--fs,1)); color:var(--ac); font-weight:var(--nw); white-space:nowrap; overflow:hidden; border-bottom:.07em solid #CDBFA8; line-height:1.5}
.d-postcard .pc-right{position:absolute; right:8%; left:52%; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:calc(6.4em * var(--fs,1)); color:var(--ac); z-index:2; line-height:1.15; transform:rotate(-6deg)}

/* notebook */
.d-notebook{padding:3.6em 13.5em 3em 6em; background:#fff}
.d-notebook .lines{position:absolute; inset:0; background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2710%27%20height%3D%2710%27%20viewBox%3D%270%200%2010%2010%27%20preserveAspectRatio%3D%27none%27%3E%3Crect%20y%3D%279.3%27%20width%3D%2710%27%20height%3D%270.7%27%20fill%3D%27%23A7C3EA%27%2F%3E%3C%2Fsvg%3E"); background-size:100% 5.8em; background-position:0 1.2em; z-index:0}
.d-notebook .margin{position:absolute; top:0; bottom:0; right:10.5em; width:.32em; background:#F08C8C; z-index:1}
.d-notebook .margin.m2{right:9.4em; background:#F7B9B9}
.d-notebook .holes{position:absolute; right:3em; top:0; bottom:0; display:flex; flex-direction:column; justify-content:space-around; z-index:1}
.d-notebook .holes i{display:block; width:3.8em; height:3.8em; border-radius:50%; background:#EFE9E1; border:.25em solid #DDD3C6}
.d-notebook .tape{position:absolute; left:7%; top:-1.4em; width:21em; height:6.6em; background:rgba(255,226,140,.78); z-index:3}
.d-notebook .n{color:var(--ac)}
.d-notebook .s{color:#24243A}
.d-notebook.f-back{padding:3em}
.d-notebook .grid{position:absolute; inset:0; background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2710%27%20height%3D%2710%27%3E%3Crect%20x%3D%279.4%27%20width%3D%270.6%27%20height%3D%2710%27%20fill%3D%27%23C9DAF0%27%2F%3E%3Crect%20y%3D%279.4%27%20width%3D%2710%27%20height%3D%270.6%27%20fill%3D%27%23C9DAF0%27%2F%3E%3C%2Fsvg%3E"); background-size:5em 5em; z-index:0}
.d-notebook .doodle{position:absolute; font-size:6em; color:var(--ac); opacity:.5; line-height:1; z-index:1; font-family:'Rubik',sans-serif}
.d-notebook.f-back .bn{background:#fff; padding:0 .4em; border-radius:.2em}

/* confetti */
.d-confetti{padding:5em 10em}
.d-confetti .frame{position:absolute; inset:2.2em; border:.7em solid #fff; border-radius:3em; z-index:1}
.d-confetti .cf{position:absolute; z-index:1; display:block}
.d-confetti .cf0{width:1.3em; height:3.2em; border-radius:.3em}
.d-confetti .cf1{width:2em; height:2em; border-radius:50%}
.d-confetti .cf2{width:2.6em; height:1.1em; border-radius:1em}
.d-confetti .disc{width:24em; height:24em; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 .8em var(--ac)}
.d-confetti .disc span{font-size:13em; line-height:1}
.d-confetti.f-back .bn{margin-top:.5em; background:#fff; padding:0 .5em; border-radius:.4em}

/* garden */
.d-garden{padding:5em 13.5em}
.d-garden .frame{position:absolute; inset:2.2em; border:.3em solid var(--ac); border-radius:1.2em; opacity:.75; z-index:1}
.d-garden .frame2{position:absolute; inset:3.4em; border:.14em solid var(--ac); border-radius:.8em; opacity:.55; z-index:1}
.d-garden .sprig{position:absolute; width:13em; height:13em; z-index:1}
.d-garden .sprig svg{width:100%; height:100%; display:block}
.d-garden .sprig.tl{left:.8em; bottom:.8em}
.d-garden .sprig.br{right:.8em; top:.8em; transform:rotate(180deg)}
.d-garden .sprig.sm{width:17em; height:17em; opacity:.85}
.d-garden .s{color:#3A3A2E}

/* comic */
.d-comic{padding:3.6em 5em 3.4em}
.d-comic .dots{position:absolute; inset:0; background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2710%27%20height%3D%2710%27%3E%3Ccircle%20cx%3D%272.5%27%20cy%3D%272.5%27%20r%3D%271.25%27%20fill%3D%27%23000%27%20fill-opacity%3D%27.13%27%2F%3E%3Ccircle%20cx%3D%277.5%27%20cy%3D%277.5%27%20r%3D%271.25%27%20fill%3D%27%23000%27%20fill-opacity%3D%27.13%27%2F%3E%3C%2Fsvg%3E"); background-size:3.4em 3.4em; z-index:0}
.d-comic .frame{position:absolute; inset:1.6em; border:.75em solid #111; border-radius:1.6em; z-index:1}
.d-comic .burst{position:absolute; left:-.8em; top:-.8em; width:19em; height:19em; z-index:3}
.d-comic .burst svg{position:absolute; inset:0; width:100%; height:100%}
.d-comic .burst span{position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; font-size:7.6em; line-height:1}
.d-comic .burst.bb{position:relative; left:0; top:0; width:30em; height:30em}
.d-comic .burst.bb span{font-size:12em}
.d-comic .n{transform:rotate(-2.5deg); color:var(--ac)}
.d-comic .bubble{position:relative; background:#fff; border:.6em solid #111; border-radius:5em; padding:2.2em 4.5em; margin-top:.4em; max-width:100%}
.d-comic .bubble .s{color:#111}
.d-comic .tail{position:absolute; left:20%; bottom:-2.9em; width:4.6em; height:4.6em; background:#fff; border-right:.6em solid #111; border-bottom:.6em solid #111; transform:rotate(45deg) skew(12deg,12deg); z-index:-1}
.d-comic .g{color:#111; opacity:.6; margin-top:1.4em}
.d-comic.f-back .bn{font-size:calc(7.4em * var(--fs,1) * var(--nfit,1)); color:#111; transform:rotate(-3deg); margin-top:.2em}

/* minimal */
.d-minimal{padding:4em 9em}
.d-minimal .bar{position:absolute; right:0; top:0; bottom:0; width:2.4em; background:var(--ac); z-index:1}
.d-minimal .corner{position:absolute; left:4em; bottom:4em; width:5em; height:5em; border-left:.35em solid var(--ac); border-bottom:.35em solid var(--ac); opacity:.5; z-index:1}
.d-minimal .n{color:var(--ink); font-size:calc(6.4em * var(--fs,1) * var(--fit,1) * var(--nfit,1))}
.d-minimal .rule{width:9em; height:.45em; background:var(--ac); border-radius:1em; margin:1em 0 1.8em}
.d-minimal .s{color:#333}
.d-minimal.f-back{background:var(--ac)}
.d-minimal .mono{font-size:calc(12em * var(--fs,1)); width:2em; height:2em; border:.045em solid #fff; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:var(--nw); line-height:1}

@media print{
  body>*:not(#printArea){display:none !important}
  #printArea{position:static; width:auto; height:auto; overflow:visible; z-index:auto}
  .sheet{page-break-after:always; break-after:page}
  @page{size:A4; margin:0}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="printArea" aria-hidden="true"></div>
<script src="icons/emoji.js?v=11"></script>
<script src="sentences.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>
